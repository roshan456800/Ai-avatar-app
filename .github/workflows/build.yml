name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'any'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get
        working-directory: Ai-avatar-app

      - name: Build APK
        run: flutter build apk --release
        working-directory: Ai-avatar-app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: Ai-avatar-app/build/app/outputs/flutter-apk/app-release.apk
